# The reference instance at dynamicruntime.org (issues #1242, #1243): a lightweight node set up by
# docs/deploy/lightweight-node.md. `kdr-deploy dynamicruntime.org` deploys to it.
#
# No secrets here, ever: this file is versioned. The node keeps its secrets (the Mailgun key) in
# <baseDir>/private/secrets.properties, which kdr-deploy never touches.

# Where the node is, and who runs the application there (over SSH, with your own keys).
host=dynamicruntime.org
user=gyassa
baseDir=/home/gyassa/kdr
service=kdr
publicUrl=https://dynamicruntime.org

# How many releases to keep on the node, the running one always among them.
keepReleases=3

# The build the release is made under (issue #1273): kdr-deploy passes it to Gradle as -PkdrBuild=reference, and
# the workspace's settings.gradle.kts leaves out its own projects (customConfig, playground) when it is set. A name
# for the build, separate from the KDR_DEPLOY_FLAVORS the node runs.
buildProfile=reference

# The node's settings: kdr-deploy writes these as <baseDir>/kdr.env, in this order. Each is explained in the
# guide's "Write the settings" step.
env.JAVA_HOME=/usr/lib/jvm/java-1.25.0-openjdk-amd64
env.KDR_DEFAULTS_FILE=none
env.KDR_WORKSPACE_DIR=/home/gyassa/kdr
env.KDR_ENV=dev
env.KDR_PORT=7070
env.KDR_BIND_ADDRESS=127.0.0.1
env.KDR_IN_MEMORY_ONLY=false
env.KDR_DB_TYPE=h2File
env.KDR_TEST_INSTANCE=true
env.KDR_PUBLIC_TEST_DEPLOYMENT=true
env.KDR_TRUST_ENV_AUTH_HEADER=false
env.KDR_ASSUME_ENV_AUTH=true
env.KDR_ENV_AUTH_FROM_ADMIN_LOGIN=true
env.KDR_ADMIN_EMAIL_DOMAIN=gyassa.com
env.KDR_PUBLIC_SIGN_IN=realMail
env.KDR_MAIL_DOMAIN=mg.dynamicruntime.org
env.KDR_PUBLIC_URL=https://dynamicruntime.org
env.KDR_LOG_LEVEL=info
env.KDR_DEPLOY_FLAVORS=reference

# The stored files, in Linode Object Storage rather than ~/kdr/fileStore (issue #1272), explained in the guide's
# "Keeping files in Linode Object Storage". The endpoint is the one the node's access key lists; the key itself is in
# the service user's ~/.aws/credentials on the node, never here. The buckets dynamicruntime-web-assets and
# dynamicruntime-sample-files must exist before a deploy: the boot check refuses the start without them.
env.KDR_FILE_STORE_TYPE=s3
env.KDR_S3_ENDPOINT=https://us-ord-10.linodeobjects.com
env.KDR_S3_REGION=us-ord-10
env.KDR_S3_BUCKET_PREFIX=dynamicruntime-
