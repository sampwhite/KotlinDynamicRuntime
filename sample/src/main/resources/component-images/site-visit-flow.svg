    <rect x="8" y="24" width="120" height="48" rx="10"/>
    <rect x="180" y="24" width="120" height="48" rx="10"/>
    <rect x="352" y="24" width="120" height="48" rx="10"/>
    <path d="M132 48 H172 M164 41 L172 48 L164 55"/>
    <path d="M304 48 H344 M336 41 L344 48 L336 55"/>
  </g>
  <g fill="#E2E8F0" font-family="sans-serif" font-size="15" text-anchor="middle">
