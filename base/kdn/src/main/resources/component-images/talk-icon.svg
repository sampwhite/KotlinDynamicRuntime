<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img">
  <title>A talk: a presentation screen on its stand</title>
  <!-- The conference demo's talk icon (issue #1545), one text line high, floated at the left of the talk's introduction
       on a workflow form. Only shown in the app, so transparent and drawn for its dark surface. The kdr-images skill's
       'slide' icon (banner.py), stroked in the accent-bright token (#818CF8). -->
  <g fill="none" stroke="#818CF8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="12" rx="1"/>
    <path d="M12 16 V20 M8 20 H16"/>
  </g>
</svg>
