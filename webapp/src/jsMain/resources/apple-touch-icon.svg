<!--
  The source of apple-touch-icon.png (issue #1783): the icon iOS puts on a home screen when someone adds the site to it
  (Safari's Share, Add to Home Screen), and which Safari's Favorites tiles show. The shell links the PNG as
  apple-touch-icon; this file is not embedded. To change it, edit this file and render it again, from this directory:

      rsvg-convert -w 180 -h 180 apple-touch-icon.svg -o apple-touch-icon.png

  180x180 on a solid #FAF9F5 ground, the branding set's spec: iOS allows no transparency, and rounds the corners itself.
  The mark is brand-mark.svg's paths, verbatim, at 144 px with an 18 px margin. The PNG it replaces was the branding
  set's, rasterized by Quick Look, which drew the icon into the top-left 108 px of the canvas and left the rest white.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img">
  <title>Schema braces mark</title>
  <rect width="180" height="180" fill="#FAF9F5"/>
  <!-- The brand mark, brand-mark.svg's own paths and colors. -->
  <g transform="translate(18 18) scale(2.25)">
    <g fill="none" stroke="#7F77DD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 8 C18 8 17 11 17 16 V24 C17 28.5 15.5 30.5 12 32 C15.5 33.5 17 35.5 17 40 V48 C17 53 18 56 23 56"/>
      <path d="M41 8 C46 8 47 11 47 16 V24 C47 28.5 48.5 30.5 52 32 C48.5 33.5 47 35.5 47 40 V48 C47 53 46 56 41 56"/>
    </g>
    <rect x="22.5" y="36" width="5" height="10" rx="1.5" fill="#1D9E75"/>
    <rect x="29.5" y="29" width="5" height="17" rx="1.5" fill="#1D9E75"/>
    <rect x="36.5" y="22" width="5" height="24" rx="1.5" fill="#D85A30"/>
  </g>
</svg>
